# Default strategy — migrated equivalent of the v2 council
# Technical (40%) + Sentiment (25%) + Fundamental (35%) + Risk veto
name: "BTC Council v2"
version: "2"

agents:
  - name: technical
    model: claude-haiku-4-5
    prompt: prompts/default/technical_analyst.txt
    weight: 0.40

  - name: sentiment
    model: claude-haiku-4-5
    prompt: prompts/default/sentiment_analyst.txt
    weight: 0.25

  - name: fundamental
    model: claude-haiku-4-5
    prompt: prompts/default/fundamental_analyst.txt
    weight: 0.35

  - name: risk
    model: claude-sonnet-4-6
    prompt: prompts/default/risk_manager.txt
    is_veto: true

deliberation:
  enabled: true
  model: claude-sonnet-4-6
  prompt: prompts/default/deliberation.txt

scoring:
  confidence_floor: 30
  trade_threshold: 0.25

risk:
  stop_loss:
    type: atr_multiple
    value: 2.0
  take_profit:
    type: atr_multiple
    value: 3.0
  max_position_pct: 20.0

validation:
  max_drawdown_pct: 15.0
  atr_spike_multiplier: 2.0
  min_news_count: 5
