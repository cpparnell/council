[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "council"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0.0",
    "pandas-ta>=0.3.14b0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.89.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.0",
    "backtesting>=0.3.3",
    "yfinance>=0.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["council*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
